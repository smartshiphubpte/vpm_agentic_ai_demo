# VoyagePM microservices — one container per independent loop.
# Shared state: registry JSON + folders + jobs/ on a common volume.
#
#   docker compose up --build
#   docker compose up --scale routeopt=4
#
# Host paths come from the project .env (same keys as local daemon).
# Per-service `environment:` is not used — it would replace this map.

x-vpm: &vpm
  image: vpm-agents:local
  build: .
  env_file: .env
  restart: unless-stopped
  init: true
  environment:
    VPM_INBOX_DIR: /data/inbox
    VPM_NOON_INBOX_DIR: /data/noon
    VPM_STORM_OUT_DIR: /data/storm
    VPM_REPORTS_OUT_DIR: /data/reports
    VPM_TEMPLATES_DIR: /data/templates
    VPM_REGISTRY_PATH: /data/registry
    VPM_JOBS_DIR: /data/jobs
    VPM_REPORT_SENDER_INBOX_DIR: /data/reports,/data/storm
  volumes:
    - ${VPM_INBOX_DIR:-/home/gunish/Projects/vpm_agentic_Data/vpm_inbox_dir}:/data/inbox
    - ${VPM_NOON_INBOX_DIR:-/home/gunish/Projects/vpm_agentic_Data/vpm_noon_inbox_dir}:/data/noon
    - ${VPM_STORM_OUT_DIR:-/home/gunish/Projects/vpm_agentic_Data/vpm_Storm_out_dir}:/data/storm
    - ${VPM_REPORTS_OUT_DIR:-/home/gunish/Projects/vpm_agentic_Data/vpm_report_out_dir}:/data/reports
    - ${VPM_TEMPLATES_DIR:-./templates}:/data/templates
    - ${VPM_REGISTRY_PATH:-/home/gunish/Projects/vpm_agentic_Data/vpm_registry_dir}:/data/registry
    - ${VPM_JOBS_DIR:-/home/gunish/Projects/vpm_agentic_Data/vpm_jobs}:/data/jobs

services:
  ingest:
    <<: *vpm
    env_file:
      - .env
      - prevoyage_db/.env
    command: ["python3", "scripts/run_service.py", "ingest"]

  noon:
    <<: *vpm
    env_file:
      - .env
      - prevoyage_db/.env
    command: ["python3", "scripts/run_service.py", "noon"]

  weather:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "weather"]

  routeopt:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "routeopt"]

  storm:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "storm"]

  port-weather:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "port_weather"]

  report-sender:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "report_sender"]

  prevoyage-db:
    <<: *vpm
    env_file:
      - .env
      - prevoyage_db/.env
    command: ["python3", "scripts/run_service.py", "prevoyage_db"]
