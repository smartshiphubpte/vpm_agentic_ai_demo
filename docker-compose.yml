# VoyagePM microservices — one container per independent loop.
# Shared job bus: named volume `vpm_jobs` at /data/jobs (no host path required).
#
#   docker compose up --build ingest prevoyage-db
#   docker compose up --build
#   docker compose up --scale routeopt=4
#
# Config:
#   Local Compose: env_file (.env) fills gaps; secret/JSON keys override env when loaded.
#   Production GCP: set VPM_CONFIG_SOURCE=gcp — loads flat JSON from Secret Manager
#     projects/605301150765/secrets/DEV-VOYAGEPM-AGENTIC-AGENT
#     (override with VPM_GCP_SECRET / VPM_GCP_SECRET_VERSION).
#   Per key: secret/JSON > process env > unset.
#   VM/service account needs roles/secretmanager.secretAccessor on that secret.
# ingest / prevoyage-db override VPM_JOBS_DIR to the shared volume path.

x-vpm: &vpm
  image: vpm-agents:local
  build: .
  env_file: .env
  restart: unless-stopped
  init: true
  volumes:
    - vpm_jobs:/data/jobs
  # Production example (drop env_file; use GCE/Workload Identity for ADC):
  environment:
    VPM_CONFIG_SOURCE: gcp
    VPM_GCP_SECRET: projects/605301150765/secrets/DEV-VOYAGEPM-AGENTIC-AGENT
    VPM_JOBS_DIR: /data/jobs

services:
  ingest:
    <<: *vpm
    env_file:
      - .env
      - prevoyage_db/.env
    # Bypass flaky Docker→systemd-resolved DNS (Errno -3 on imap.*).
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python3", "scripts/run_service.py", "ingest"]
    environment:
      VPM_JOBS_DIR: /data/jobs
    volumes:
      - vpm_jobs:/data/jobs

  noon:
    <<: *vpm
    env_file:
      - .env
      - prevoyage_db/.env
    command: ["python3", "scripts/run_service.py", "noon"]

  weather:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "weather"]

  routeopt:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "routeopt"]

  storm:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "storm"]

  port-weather:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "port_weather"]

  report-sender:
    <<: *vpm
    command: ["python3", "scripts/run_service.py", "report_sender"]

  prevoyage-db:
    <<: *vpm
    env_file:
      - .env
      - prevoyage_db/.env
    command: ["python3", "scripts/run_service.py", "prevoyage_db"]
    environment:
      VPM_JOBS_DIR: /data/jobs
    volumes:
      - vpm_jobs:/data/jobs

volumes:
  vpm_jobs:
